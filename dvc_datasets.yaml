datasets:
  standard_effort:
    n: 50000
    seed: 47   # 43 hits a rare NonTerminatingShotError (low-gravity outlier +
               # high angle exceeds simulate_landing's max_time); 47 is clean.
    input_mode: EFFORT
    elevation_mean: 45.0
    elevation_std: 20.0
    hit_tolerance: 5.0

  standard_velocity:
    n: 50000
    seed: 42
    input_mode: VELOCITY
    elevation_mean: 45.0
    elevation_std: 20.0
    hit_tolerance: 5.0

  # Add a dataset by adding an entry here -- dvc.yaml's `generate` foreach
  # expands one independently-cached generate@<key> stage per entry, writing
  # data/<key>.parquet. Covers variants expressible as generate() arguments
  # (n, seed, input_mode, elevation distribution, hit tolerance); different
  # generation *logic* needs its own module and stage (see `gorillas_datasets`
  # / generate_gorillas below, which uses data_generation.gorillas instead).
  #
  # standard_effort/standard_velocity are the two input modes of the same
  # generator (mirrors the Gorillas EFFORT/VELOCITY split): VELOCITY draws
  # launch speed directly, EFFORT derives it from a capped force model.
  # Both carry the regression and classification targets together.

gorillas_datasets:
  # Two variants of the same physical setup (same board count), differing in
  # what the thrower controls (input_mode) -- see data_generation/gorillas.py.
  #
  # One file per mode, not per {mode} x {regression/classification} -- one
  # throw already produces both initial_velocity_ms and hit_target, so both
  # training types read the same generated file.
  #
  # n=5000 (vs the Python generator's 40-50k) is a second, authentic data
  # source to compare against, not a replacement for volume.
  #
  # `throws` and `boards_per_chunk` change the resulting rows (unlike
  # performance knobs like --workers), so they belong here.
  gorillas_effort:
    n: 60000
    seed: 42
    input_mode: EFFORT
    throws: 32
    boards_per_chunk: 25
    hit_tolerance: 5.0

  gorillas_velocity:
    n: 5000
    seed: 44
    input_mode: VELOCITY
    throws: 32
    boards_per_chunk: 25
    hit_tolerance: 5.0
