      hash: md5
      md5: 6ec44083e42326d7a0eb202cbdd967af
      size: 815
    - path: models/regression/train_linear_regression.py
      hash: md5
      md5: 3ad77bedd68e5db1ca8eefe25852e323
      size: 1045
    params:
      params.yaml:
        n_samples: 40000
        search.regression.linear_regression.cv: 5
        search.regression.linear_regression.n_iter:
        test_size: 0.2
        training_data: standard_training_data
    outs:
