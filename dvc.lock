schema: '2.0'
stages:
  generate@standard_training_data:
    cmd: python -m data_generation.generate --n 50000 --seed 42 --elevation-mean
      45.0 --elevation-std 20.0 --hit-tolerance 5.0 --out 
      data/standard_training_data.parquet
    deps:
    - path: data_generation/generate.py
      hash: md5
      md5: a103fafc78caf25facb0db78a2b26bec
