      hash: md5
      md5: 02508bdc24964375faee37a43313d6e6
      size: 644
    - path: data_generation/outliers.py
      hash: md5
      md5: 119f8e1986bbd383db6e0c85c6e24325
      size: 1028
    - path: data_generation/sampling.py
      hash: md5
      md5: ca8e5c5f68e8c415ee1416b9095ce5d6
      size: 5199
    - path: physics.py
      hash: md5
      md5: 925f03085b2e7b1e078e47ae71547334
      size: 1988
    outs:
    - path: data/standard_training_data.parquet
      hash: md5
      md5: a09a1d372a6b23f1487787f8c282b9c2
      size: 4922590
  generate_gorillas@gorillas_effort_data:
    cmd: python -m data_generation.gorillas --n 5000 --seed 42 --input-mode 
      EFFORT --throws 32 --boards-per-chunk 25 --hit-tolerance 5.0 --overwrite 
      --out data/gorillas_effort_data.parquet --raw-out 
      data/gorillas_effort_data_throws.csv
    deps:
    - path: data_generation/gorillas.py
      hash: md5
      md5: 2afd73f278d501b96bec96470a195047
      size: 25437
    - path: data_generation/io.py
      hash: md5
      md5: 02508bdc24964375faee37a43313d6e6
      size: 644
    - path: data_generation/outliers.py
      hash: md5
      md5: 119f8e1986bbd383db6e0c85c6e24325
      size: 1028
