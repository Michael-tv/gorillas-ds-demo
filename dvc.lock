      models/regression/train_linear_regression.py 
      TRAIN_MODEL_NAME=linear_regression TRAIN_CLEAN=
    deps:
    - path: data/standard_training_data.parquet
      hash: md5
      md5: a09a1d372a6b23f1487787f8c282b9c2
      size: 4922590
