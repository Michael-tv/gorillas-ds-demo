# DVC params -- see dvc.yaml `params:` sections and params.py.
# Changing a value here marks the matching stage(s) stale for `dvc exp run`/`dvc repro`.
#
# n_iter/cv search knobs live in each experiment's own local params.yaml
# (experiments/<domain>/<mode>/<experiment>/params.yaml), not here -- read via
# params.load_experiment_params(__file__).

# Which generated pool to read; matches a key in dvc_datasets.yaml or a
# Gorillas dataset key, and resolves to data/<name>.parquet via params.data_path().
# Must be generated first (`dvc repro`) or downstream stages fail on a missing dep.
training_data: standard_velocity

test_size: 0.2

# Sample-size tier for the convergence experiment; sweep with
# `dvc exp run --set-param n_samples=...`. Nested prefix of the seeded
# standard_velocity pool (50000 rows), so growing n_samples is the only change.
n_samples: 40000

# Skewed-extrapolation demo: data_generation/filter_skewed.py splits the pool at
# this launch angle -- at/below becomes the skewed training set, above becomes
# the OOD holdout (data/skewed_holdout.parquet).
skew:
  max_angle_deg: 30
