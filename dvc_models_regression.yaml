# Which regression models each training stage expands into. dvc.yaml reads
# this via `vars:` and turns every entry into one independently-cached stage.
#
# `algorithm:` names a module in experiments/regression/algorithms/; the entry's
# key is the output name (model_<key>.joblib, metrics_<key>.csv) and `--key`
# to train.py. Most entries have algorithm == key; random_forest_no_outlier
# is the one alias (reuses random_forest's logic with a different `clean`).
#
# decision_tree_overfit is NOT listed here -- it needs a different script
# (no train/test split) so it can't share this foreach's `cmd:` template; it
# gets its own explicit stage in each regression pipeline instead.
#
# The sweep is seven algorithms spanning underfit/overfit/instance-based/ensemble:
# linear_regression, decision_tree, knn, polynomial, random_forest, mlp, xgboost.
# Each appears once with default cleaning (clean: ""); deviations are listed below.
#
# Also drives the Gorillas effort/velocity groups (train_raw_*, train_eng_*)
# -- same matrix, different fixed pool per pipeline.

regression_models:
  linear_regression:  {algorithm: linear_regression, clean: ""}
  decision_tree:       {algorithm: decision_tree,     clean: ""}
  knn:                 {algorithm: knn,               clean: ""}
  polynomial:          {algorithm: polynomial,        clean: ""}
  random_forest:       {algorithm: random_forest,     clean: ""}
  mlp:                 {algorithm: mlp,               clean: ""}
  xgboost:             {algorithm: xgboost,           clean: ""}

  # Deviation: one cleaning contrast, to make the cleaning strategy visible
  # in `dvc exp show` without repeating it for every algorithm.
  random_forest_no_outlier: {algorithm: random_forest, clean: "no_outlier"}

skewed_models:
  # Same seven-model sweep on the angle-capped pool, so data is the only
  # difference vs train_raw. (No decision_tree_overfit -- not part of this matrix.)
  linear_regression: {algorithm: linear_regression, clean: ""}
  decision_tree:     {algorithm: decision_tree,     clean: ""}
  knn:               {algorithm: knn,               clean: ""}
  polynomial:        {algorithm: polynomial,        clean: ""}
  random_forest:     {algorithm: random_forest,     clean: ""}
  mlp:               {algorithm: mlp,               clean: ""}
  xgboost:           {algorithm: xgboost,           clean: ""}

  # Deviation: ridge/lasso appear only here -- regularised-linear vs tree is
  # the extrapolation contrast this run exists to show.
  ridge: {algorithm: ridge, clean: ""}
  lasso: {algorithm: lasso, clean: ""}
