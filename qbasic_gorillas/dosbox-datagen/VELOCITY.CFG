' VELOCITY.CFG -- the raw-velocity variant of the game, for playing by hand.
'
' Copied over GORCFG.TXT by velocity.conf's [autoexec] at launch, because
' ReadCfg always reads that one fixed name (QBASIC /RUN cannot take arguments).
'
' Format: KEY=VALUE. Blank lines and lines starting with an apostrophe are
' ignored, unknown keys are ignored, and anything left out keeps its default.
'
' You throw by entering an angle and a launch speed in m/s directly. There is no
' force model in the way: no effort jitter, no dependence on the banana's mass,
' and no MaxThrowVelocity# cap. What you type is what gets integrated.
'
' That difference is the point of having both variants. Here the launch speed is
' something you control and observe exactly; in the Effort variant the same
' quantity is hidden behind a noisy nonlinear transform.

DATAMODE=0              ' 0 = play it yourself. The Python harness sets this to
                        ' 1 for unattended data runs; it writes its own config.
INPUTMODE=VELOCITY

' ---- features you can switch off to see what each one contributes ----
EFFORTJITTER=0          ' no effect in this mode: there is no effort to jitter
BANANAVAR=1             ' banana mass/size still vary, and still change the
                        ' drag, but no longer change the launch speed
HUD=1                   ' distance / wind / banana readouts
DESTRUCT=1              ' explosions damage the skyline, as in the real game

GRAVITY=9.8
