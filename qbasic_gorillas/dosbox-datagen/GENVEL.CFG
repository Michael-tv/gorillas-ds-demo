' GENVEL.CFG -- unattended batch run, VELOCITY variant, with the game visible.
'
' Copied over GORCFG.TXT by genvelocity.conf's [autoexec] at launch.
'
' This is the "watch it generate" mode: ANIMATE=1 keeps the pacing and the full
' skyline, so it looks like the real game playing itself. It is deliberately
' slow -- roughly one throw every second or two. For volume, the Python harness
' runs the same build with ANIMATE=0 and gets ~15 rows/s.
'
' Leave any setting blank or delete the line to take its default.

DATAMODE=1
INPUTMODE=VELOCITY
ANIMATE=1               ' 1 = watch it. 0 = as fast as DOSBox will go.
FASTDRAW=0              ' 0 = draw everything, including windows and the sun.
                        ' 1 skips only drawing that cannot affect collision;
                        ' verified to leave every physics field bit-identical.
HUD=1
DESTRUCT=1              ' explosions and craters, as in the real game.
                        '
                        ' Note the trade-off, because it is not cosmetic. The
                        ' crater is painted into the framebuffer, and the
                        ' framebuffer IS the collision model (PlotShot probes
                        ' it with POINT). So with this on, throw N lands on
                        ' terrain shaped by throws 1..N-1 -- a hidden variable
                        ' that is not in any logged column, and a gorilla
                        ' destroyed early can never be hit again on that board.
                        ' Fine, and wanted, for a demo that should look like
                        ' the game. The Python harness sets this to 0 for
                        ' volume runs so every throw on a board sees identical
                        ' terrain.

BOARDS=3
THROWS=6
ALTERNATE=1
SEED=12345              ' any non-zero value is reproducible; 0 = use the clock

' ---- sampling ranges (blank = default) ----
ANGLEMIN=10
ANGLEMAX=88
VELMIN=10
VELMAX=80

GRAVITY=9.8
DT=0.1
MAXTICKS=0
OUTFILE=THROWS.CSV
FLUSHEVERY=10