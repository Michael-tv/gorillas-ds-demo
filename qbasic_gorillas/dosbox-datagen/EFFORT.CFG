' EFFORT.CFG -- the Effort% variant of the game, for playing by hand.
'
' Copied over GORCFG.TXT by effort.conf's [autoexec] at launch, because
' ReadCfg always reads that one fixed name (QBASIC /RUN cannot take arguments).
'
' Format: KEY=VALUE. Blank lines and lines starting with an apostrophe are
' ignored, unknown keys are ignored, and anything left out keeps its default.
'
' You throw by entering an angle and an Effort% from 0 to 100. Effort becomes a
' force applied over the gorilla's throwing stroke, so launch speed comes out as
' SQR(2 * Force * ThrowStrokeM# / BananaMass#) -- meaning the speed you actually
' get depends on how heavy this particular banana is, and is capped at
' MaxThrowVelocity# (44 m/s, calibrated for the giant banana).

DATAMODE=0              ' 0 = play it yourself. The Python harness sets this to
                        ' 1 for unattended data runs; it writes its own config.
INPUTMODE=EFFORT

' ---- features you can switch off to see what each one contributes ----
EFFORTJITTER=1          ' gorillas cannot apply exactly the effort you asked
                        ' for: +/-8 percentage points, triangular
BANANAVAR=1             ' this banana's mass and size are sampled fresh each
                        ' throw, so identical effort gives different speeds
HUD=1                   ' distance / wind / banana readouts
DESTRUCT=1              ' explosions damage the skyline, as in the real game

GRAVITY=9.8
