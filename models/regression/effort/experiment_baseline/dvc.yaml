# experiment_baseline (effort): the simplest possible run on this pool -- one
# default Linear Regression, no hyperparameter search, 1000 no-outlier rows.
# See models/regression/effort/experiment_baseline/train_linear_regression.py.
#
# All paths below are ../../../../-prefixed -- this file lives four levels
# under the repo root (models/<domain>/<mode>/<experiment>/dvc.yaml), next to
# the training scripts it runs. See the top-level README's "Running one
# pipeline at a time" section for the full explanation of this repo's
# cross-pipeline-dependency / relative-path / explicit-params.yaml conventions.

stages:

  train_baseline_effort_linear_regression:
    cmd: python ../../../../scripts/run_with_pythonpath.py ../../../.. -m models.regression.effort.experiment_baseline.train_linear_regression
    deps:
      - ../../../../data/gorillas_effort.parquet
      - ../../../../models/regression/effort/experiment_baseline/train_linear_regression.py
      - ../../../../models/regression/algorithms/linear_regression.py
      - ../../../../models/regression/common/loader.py
      - ../../../../feature_engineering.py
      - ../../../../splitting.py
    params:
      - ../../../../params.yaml:
          - test_size
      - ../../../../models/regression/effort/experiment_baseline/params.yaml:
          - n_samples
    outs:
      - ../../../../experiments_results/regression/effort/experiment_baseline/models/model_linear_regression.joblib
    metrics:
      - ../../../../experiments_results/regression/effort/experiment_baseline/models/metrics_linear_regression.csv:
          cache: false
