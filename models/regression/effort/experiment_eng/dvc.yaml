# experiment_eng: the 9-model engineered-feature sweep, permanently on
# data/gorillas_effort.parquet. See ../experiment_raw/dvc.yaml's header -- same
# pattern, ENG_FEATURES instead of RAW_FEATURES.
#
# All paths below are ../../../../-prefixed -- this file lives four levels
# under the repo root (models/<domain>/<mode>/<experiment>/dvc.yaml), next to
# the training scripts it runs. See the top-level README's "Running one
# pipeline at a time" section for the full explanation of this repo's
# cross-pipeline-dependency / relative-path / explicit-params.yaml conventions.

stages:

  train_eng_effort_linear_regression:
    cmd: python ../../../../scripts/run_with_pythonpath.py ../../../.. -m models.regression.effort.experiment_eng.train_linear_regression
    deps:
      - ../../../../data/gorillas_effort.parquet
      - ../../../../models/regression/effort/experiment_eng/train_linear_regression.py
      - ../../../../models/regression/algorithms/linear_regression.py
      - ../../../../models/regression/common/loader.py
      - ../../../../feature_engineering.py
      - ../../../../splitting.py
    params:
      - ../../../../params.yaml:
          - test_size
      - ../../../../models/regression/effort/experiment_eng/params.yaml:
          - cv
          - n_iter.linear_regression
    outs:
      - ../../../../experiments_results/regression/effort/experiment_eng/models/model_linear_regression.joblib
    metrics:
      - ../../../../experiments_results/regression/effort/experiment_eng/models/metrics_linear_regression.csv:
          cache: false

  train_eng_effort_decision_tree:
