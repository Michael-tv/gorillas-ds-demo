# RandomizedSearchCV/*CV fold count for this experiment's search, one value
# for every model (previously a per-algorithm value under the shared root
# params.yaml's search.regression.<model>.cv -- moved here since it's an
# experiment/pool concern, not a global one: this pool's grouped CV protects
# against leaking a board's correlated throws across folds, unlike the
# standard pool's search, which now uses a single validation split instead
# (splitting.single_split_cv()) and never reads this key at all. Capped at
# the number of groups available -- see splitting.cv_for().
cv: 5

# RandomizedSearchCV/*CV search budget (n_iter), one value for every model --
# moved out of the shared root params.yaml since the search block otherwise
# forced every experiment to share one search-budget schedule with no way to
# size it per pool/experiment. `null` means that algorithm doesn't search at
# all (LinearRegression/Ridge/Lasso/Polynomial's *CV meta-estimators pick
# their own hyperparameter internally, or there simply isn't one).
n_iter:
  linear_regression: null
  ridge:              null
  lasso:              null
  polynomial:         null
  decision_tree:      30
  knn:                20
  random_forest:      20
  mlp:                15
  xgboost:            20
