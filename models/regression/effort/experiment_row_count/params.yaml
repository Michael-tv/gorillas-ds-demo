# Sample-size tiers for this experiment's convergence sweep -- nested prefix
# slices of one seeded pool (data/gorillas_effort.parquet, 5000 rows), so
# growing a tier is the only thing that changes between runs. See
# train_linear_regression.py's docstring for the general row-count-sweep
# rationale. Tracked as a DVC params: dependency (see this pool's dvc.yaml),
# so changing this list marks every train_row_count_effort_* stage stale.
#
# Matches velocity's tiers (same 5000-row pool size) -- previously this file's
# tiers were [500, 1000, 2500, 5000, 10000, 20000], which had no 2000 tier
# (breaking dvc.yaml's declared model_*_n2000.joblib output) and wasted
# compute reprocessing the same full 5000-row pool twice at 10000/20000.
tiers: [500, 1000, 2000, 3000, 4000, 5000]
