# experiment_row_count (regression): does more data help? Each script sweeps 6
# sample-size tiers internally on data/gorillas_effort.parquet.
#
# All paths below are ../../../../-prefixed -- this file lives four levels
# under the repo root (models/<domain>/<mode>/<experiment>/dvc.yaml), next to
# the training scripts it runs. See the top-level README's "Running one
# pipeline at a time" section for the full explanation of this repo's
# cross-pipeline-dependency / relative-path / explicit-params.yaml conventions.

stages:

  train_row_count_effort_linear_regression:
    cmd: python ../../../../scripts/run_with_pythonpath.py ../../../.. -m models.regression.effort.experiment_row_count.train_linear_regression
    deps:
      - ../../../../data/gorillas_effort.parquet
      - ../../../../models/regression/effort/experiment_row_count/train_linear_regression.py
      - ../../../../models/regression/algorithms/linear_regression.py
      - ../../../../models/regression/common/loader.py
      - ../../../../feature_engineering.py
      - ../../../../splitting.py
    params:
      - ../../../../params.yaml:
          - test_size
      - ../../../../models/regression/effort/experiment_row_count/params.yaml:
          - tiers
          - cv
          - n_iter.linear_regression
    outs:
      - ../../../../experiments_results/regression/effort/experiment_row_count/tiers/linear_regression/
    metrics:
      - ../../../../experiments_results/regression/effort/experiment_row_count/models/metrics_linear_regression.csv:
          cache: false

  train_row_count_effort_decision_tree:
    cmd: python ../../../../scripts/run_with_pythonpath.py ../../../.. -m models.regression.effort.experiment_row_count.train_decision_tree
    deps:
      - ../../../../data/gorillas_effort.parquet
      - ../../../../models/regression/effort/experiment_row_count/train_decision_tree.py
      - ../../../../models/regression/algorithms/decision_tree.py
      - ../../../../models/regression/common/loader.py
      - ../../../../feature_engineering.py
      - ../../../../splitting.py
    params:
      - ../../../../params.yaml:
          - test_size
      - ../../../../models/regression/effort/experiment_row_count/params.yaml:
          - tiers
          - cv
          - n_iter.decision_tree
    outs:
      - ../../../../experiments_results/regression/effort/experiment_row_count/tiers/decision_tree/
    metrics:
      - ../../../../experiments_results/regression/effort/experiment_row_count/models/metrics_decision_tree.csv:
          cache: false

