# experiment_raw: the 9-model raw-feature sweep, permanently on
# data/gorillas_velocity.parquet. See
# models/regression/velocity/experiment_raw/train_linear_regression.py for
# the one-script-per-model pattern this stage set drives.
#
# All paths below are ../../../../-prefixed -- this file lives four levels
# under the repo root (models/<domain>/<mode>/<experiment>/dvc.yaml), next to
# the training scripts it runs. See the top-level README's "Running one
# pipeline at a time" section for the full explanation of this repo's
# cross-pipeline-dependency / relative-path / explicit-params.yaml conventions.

stages:

  train_raw_velocity_linear_regression:
    cmd: python ../../../../scripts/run_with_pythonpath.py ../../../.. -m models.regression.velocity.experiment_raw.train_linear_regression
    deps:
      - ../../../../data/gorillas_velocity.parquet
      - ../../../../models/regression/velocity/experiment_raw/train_linear_regression.py
      - ../../../../models/regression/algorithms/linear_regression.py
      - ../../../../models/regression/common/loader.py
      - ../../../../feature_engineering.py
      - ../../../../splitting.py
    params:
      - ../../../../params.yaml:
          - test_size
          - search.regression.linear_regression.n_iter
      - ../../../../models/regression/velocity/experiment_raw/params.yaml:
          - cv
    outs:
      - ../../../../experiments_results/regression/velocity/experiment_raw/models/model_linear_regression.joblib
    metrics:
      - ../../../../experiments_results/regression/velocity/experiment_raw/models/metrics_linear_regression.csv:
          cache: false

  train_raw_velocity_decision_tree:
