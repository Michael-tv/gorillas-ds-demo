# Sample-size tiers for this experiment's convergence sweep -- nested prefix
# slices of one seeded pool (data/gorillas_velocity.parquet, 5000 rows), so
# growing a tier is the only thing that changes between runs. See
# train_linear_regression.py's docstring for the general row-count-sweep
# rationale. Tracked as a DVC params: dependency (see this pool's dvc.yaml),
# so changing this list marks every train_row_count_velocity_* stage stale.
tiers: [500, 1000, 2000, 3000, 4000, 5000]

# RandomizedSearchCV/*CV fold count for this experiment's search, one value
# for every model -- moved out of the shared root params.yaml since it's an
# experiment/pool concern: this pool's grouped CV protects against leaking a
# board's correlated throws across folds. Capped at the number of groups
# available -- see splitting.cv_for().
cv: 5

# RandomizedSearchCV/*CV search budget (n_iter), one value for every model --
# moved out of the shared root params.yaml since the search block otherwise
# forced every experiment to share one search-budget schedule with no way to
# size it per pool/experiment. `null` means that algorithm doesn't search at
# all (LinearRegression/Ridge/Lasso/Polynomial's *CV meta-estimators pick
# their own hyperparameter internally, or there simply isn't one).
n_iter:
  linear_regression: null
  ridge:              null
  lasso:              null
  polynomial:         null
  decision_tree:      30
  knn:                20
  random_forest:      20
  mlp:                15
  xgboost:            20
