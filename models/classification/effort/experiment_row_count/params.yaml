# Sample-size tiers for this experiment's convergence sweep -- nested prefix
# slices of one seeded pool (data/gorillas_effort.parquet, 5000 rows), so
# growing a tier is the only thing that changes between runs. Tracked as a
# DVC params: dependency (see this pool's dvc.yaml), so changing this list
# marks every train_row_count_classification_effort_* stage stale.
tiers: [500, 1000, 2000, 3000, 4000, 5000]

# No `cv` here -- unlike experiment_classification, this experiment's inner
# hyperparameter-search validation uses splitting.single_split_cv() (a plain
# ShuffleSplit), not splitting.cv_for()'s group-aware, label-stratified
# k-fold. The outer train/test split (splitting.split(), untouched) is still
# group-aware, so a board's throws never cross into the test set either
# way -- only the inner validation split used while picking hyperparameters
# loses group-awareness. Deliberate: the repo owner judged that leakage risk
# not worth protecting against for this sweep.

# RandomizedSearchCV search budget (n_iter), one value for every model --
# moved out of the shared root params.yaml for the same reason as the
# regression side (see e.g.
# models/regression/effort/experiment_raw/params.yaml). `null` means that
# algorithm doesn't search (LogisticRegression has no hyperparameters to
# tune here).
n_iter:
  logistic_regression: null
  decision_tree:        30
  knn:                  12
  random_forest:        20
  mlp:                  15
  xgboost:              20
