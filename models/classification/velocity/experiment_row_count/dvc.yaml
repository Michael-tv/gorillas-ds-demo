# experiment_row_count (classification): does more data help? Each script sweeps 6
# sample-size tiers internally on data/gorillas_velocity.parquet.
#
# All paths below are ../../../../-prefixed -- this file lives four levels
# under the repo root (models/<domain>/<mode>/<experiment>/dvc.yaml), next to
# the training scripts it runs. See the top-level README's "Running one
# pipeline at a time" section for the full explanation of this repo's
# cross-pipeline-dependency / relative-path / explicit-params.yaml conventions.

stages:


  train_row_count_classification_velocity_logistic_regression:
    cmd: python ../../../../scripts/run_with_pythonpath.py ../../../.. -m models.classification.velocity.experiment_row_count.train_logistic_regression
    deps:
      - ../../../../data/gorillas_velocity.parquet
      - ../../../../models/classification/velocity/experiment_row_count/train_logistic_regression.py
      - ../../../../models/classification/algorithms/logistic_regression.py
      - ../../../../models/classification/common/loader.py
      - ../../../../feature_engineering.py
      - ../../../../splitting.py
    params:
      - ../../../../params.yaml:
          - test_size
          - search.classification.logistic_regression.n_iter
      - ../../../../models/classification/velocity/experiment_row_count/params.yaml:
          - tiers
          - cv
    outs:
      - ../../../../experiments_results/classification/velocity/experiment_row_count/tiers/logistic_regression/
    metrics:
      - ../../../../experiments_results/classification/velocity/experiment_row_count/models/metrics_logistic_regression.csv:
          cache: false

  train_row_count_classification_velocity_decision_tree:
