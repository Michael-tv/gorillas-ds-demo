# Which classification models each training stage expands into. dvc.yaml
# reads this via `vars:` and turns every entry into one independently-cached stage.
#
# `algorithm:` names a module in experiments/classification/algorithms/; the
# entry's key is the output name (model_<key>.joblib, metrics_<key>.csv) and
# `--key` to train.py. Also drives the Gorillas effort/velocity groups, same
# matrix against a different fixed pool per pipeline.

classification_models:
  # The same sweep minus polynomial, for which there is no classifier script.
  logistic_regression: {algorithm: logistic_regression}
  decision_tree:       {algorithm: decision_tree}
  knn:                 {algorithm: knn}
  random_forest:       {algorithm: random_forest}
  mlp:                 {algorithm: mlp}
  xgboost:             {algorithm: xgboost}
