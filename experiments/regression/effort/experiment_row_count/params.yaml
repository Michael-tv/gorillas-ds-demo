# Sample-size tiers for this experiment's convergence sweep -- nested prefix
# slices of one seeded pool (data/gorillas_effort.parquet). Tracked as a DVC
# params dependency, so changing this list marks every
# train_row_count_effort_* stage stale.
tiers: [500, 1000, 2000, 4000, 8000, 16000]

# No `cv` here: this experiment's inner hyperparameter search uses
# splitting.single_split_cv() (plain ShuffleSplit), not group-aware k-fold.
# The outer train/test split is still group-aware.

# RandomizedSearchCV/*CV search budget per model. `null` means that algorithm
# doesn't search (LinearRegression/Ridge/Lasso/Polynomial pick their own
# hyperparameter internally via *CV meta-estimators, or there isn't one).
n_iter:
  linear_regression: null
  ridge:              null
  lasso:              null
  polynomial:         null
  decision_tree:      30
  knn:                20
  random_forest:      20
  mlp:                15
  xgboost:            20
