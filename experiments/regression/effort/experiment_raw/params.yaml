# CV fold count for this experiment's search (all models). Grouped CV protects
# against leaking a board's correlated throws across folds; capped at the
# number of groups available (splitting.cv_for()). Unlike the standard pool's
# search, which uses a single validation split and never reads this key.
cv: 5

# RandomizedSearchCV/*CV search budget per model. `null` means that algorithm
# doesn't search (LinearRegression/Ridge/Lasso/Polynomial pick their own
# hyperparameter internally via *CV meta-estimators, or there isn't one).
n_iter:
  linear_regression: null
  ridge:              null
  lasso:              null
  polynomial:         null
  decision_tree:      30
  knn:                20
  random_forest:      20
  mlp:                15
  xgboost:            20
