# experiment_raw: 9-model raw-feature sweep on data/gorillas_effort.parquet.
# See train_linear_regression.py for the one-script-per-model pattern.
# Paths are ../../../../-prefixed (4 levels under repo root); see README "Running one
# pipeline at a time" for the relative-path convention.

stages:

  train_raw_effort_linear_regression:
    cmd: python ../../../../scripts/run_with_pythonpath.py ../../../.. -m experiments.regression.effort.experiment_raw.train_linear_regression
    deps:
      - ../../../../data/gorillas_effort.parquet
      - ../../../../experiments/regression/effort/experiment_raw/train_linear_regression.py
      - ../../../../experiments/regression/algorithms/linear_regression.py
      - ../../../../experiments/regression/common/loader.py
      - ../../../../feature_engineering.py
      - ../../../../splitting.py
    params:
      - ../../../../params.yaml:
          - test_size
      - ../../../../experiments/regression/effort/experiment_raw/params.yaml:
          - cv
          - n_iter.linear_regression
    outs:
      - ../../../../experiments/regression/effort/experiment_raw/results/models/model_linear_regression.joblib
    metrics:
      - ../../../../experiments/regression/effort/experiment_raw/results/metrics/metrics_linear_regression.csv:
          cache: false

  train_raw_effort_decision_tree:
