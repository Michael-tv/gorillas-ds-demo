# experiment_baseline (effort): single default Linear Regression, no search, 1000 rows.
# Paths are ../../../../-prefixed (4 levels under repo root); see README "Running one
# pipeline at a time" for the relative-path convention.

stages:

  train_baseline_effort_linear_regression:
    cmd: python ../../../../scripts/run_with_pythonpath.py ../../../.. -m experiments.regression.effort.experiment_baseline.train_linear_regression
    deps:
      - ../../../../data/gorillas_effort.parquet
      - ../../../../experiments/regression/effort/experiment_baseline/train_linear_regression.py
      - ../../../../experiments/regression/algorithms/linear_regression.py
      - ../../../../experiments/regression/common/loader.py
      - ../../../../feature_engineering.py
      - ../../../../splitting.py
    params:
      - ../../../../params.yaml:
          - test_size
      - ../../../../experiments/regression/effort/experiment_baseline/params.yaml:
          - n_samples
    outs:
      - ../../../../experiments/regression/effort/experiment_baseline/results/models/model_linear_regression.joblib
    metrics:
      - ../../../../experiments/regression/effort/experiment_baseline/results/metrics/metrics_linear_regression.csv:
          cache: false
