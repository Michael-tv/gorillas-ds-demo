# experiment_bias_variance_bootstrap (effort): bootstrap bias/variance decomposition
# of Linear Regression and Decision Tree, at the same tiers as experiment_row_count.
# Paths are ../../../../-prefixed (4 levels under repo root); see README "Running one
# pipeline at a time" for the relative-path convention.

stages:

  train_bias_variance_bootstrap_effort_linear_regression:
    cmd: python ../../../../scripts/run_with_pythonpath.py ../../../.. -m experiments.regression.effort.experiment_bias_variance_bootstrap.train_linear_regression
    deps:
      - ../../../../data/gorillas_effort.parquet
      - ../../../../experiments/regression/effort/experiment_bias_variance_bootstrap/train_linear_regression.py
      - ../../../../experiments/regression/algorithms/linear_regression.py
      - ../../../../experiments/regression/common/loader.py
      - ../../../../feature_engineering.py
      - ../../../../splitting.py
    params:
      - ../../../../params.yaml:
          - test_size
      - ../../../../experiments/regression/effort/experiment_bias_variance_bootstrap/params.yaml:
          - tiers
          - n_bootstrap
    outs:
      - ../../../../experiments/regression/effort/experiment_bias_variance_bootstrap/results/models/linear_regression/
    metrics:
      - ../../../../experiments/regression/effort/experiment_bias_variance_bootstrap/results/metrics/metrics_linear_regression.csv:
          cache: false

  train_bias_variance_bootstrap_effort_decision_tree:
    cmd: python ../../../../scripts/run_with_pythonpath.py ../../../.. -m experiments.regression.effort.experiment_bias_variance_bootstrap.train_decision_tree
    deps:
      - ../../../../data/gorillas_effort.parquet
      - ../../../../experiments/regression/effort/experiment_bias_variance_bootstrap/train_decision_tree.py
      - ../../../../experiments/regression/algorithms/decision_tree.py
      - ../../../../experiments/regression/common/loader.py
      - ../../../../feature_engineering.py
      - ../../../../splitting.py
    params:
      - ../../../../params.yaml:
          - test_size
      - ../../../../experiments/regression/effort/experiment_bias_variance_bootstrap/params.yaml:
          - tiers
          - n_bootstrap
          - n_iter
    outs:
      - ../../../../experiments/regression/effort/experiment_bias_variance_bootstrap/results/models/decision_tree/
    metrics:
      - ../../../../experiments/regression/effort/experiment_bias_variance_bootstrap/results/metrics/metrics_decision_tree.csv:
          cache: false
