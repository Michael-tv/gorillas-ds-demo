# Same tiers as experiment_row_count/params.yaml, duplicated (not shared) so
# bias2/variance numbers line up 1:1 against that experiment's mae at each n_samples.
tiers: [500, 1000, 2000, 3000, 4000, 5000]

# Bootstrap resamples fit per tier to estimate variance. Higher reduces noise
# in the estimate at the cost of more fits per tier.
n_bootstrap: 30

# RandomizedSearchCV search budget for Decision Tree, used once per tier to
# pick fixed hyperparameters before bootstrapping -- see
# train_decision_tree.py's docstring for why the search itself isn't
# repeated per bootstrap resample. No entry needed for linear_regression:
# it has no hyperparameters to tune (see train_linear_regression.py).
n_iter:
  decision_tree: 30
