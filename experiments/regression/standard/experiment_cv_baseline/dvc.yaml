# experiment_cv_baseline: verbatim copy of experiment_raw that deliberately
# KEEPS 5-fold cross-validation in the hyperparameter search (splitting.cv_for),
# instead of experiment_raw's single validation split. A "before" comparison
# baseline for the CV speed/robustness talk demo -- see
# experiments/regression/standard/experiment_cv_baseline/train_decision_tree.py.
#

vars:
  - ../../../../params.yaml

stages:

  train_cv_baseline_linear_regression:
    cmd: python ../../../../scripts/run_with_pythonpath.py ../../../.. -m experiments.regression.standard.experiment_cv_baseline.train_linear_regression
    deps:
      - ../../../../data/standard_velocity.parquet
      - ../../../../experiments/regression/standard/experiment_cv_baseline/train_linear_regression.py
      - ../../../../experiments/regression/algorithms/linear_regression.py
      - ../../../../experiments/regression/common/loader.py
      - ../../../../feature_engineering.py
      - ../../../../splitting.py
    params:
      - ../../../../params.yaml:
          - n_samples
          - test_size
      - ../../../../experiments/regression/standard/experiment_cv_baseline/params.yaml:
          - cv
          - n_iter.linear_regression
    outs:
      - ../../../../experiments/regression/standard/experiment_cv_baseline/results/models/model_linear_regression.joblib
    metrics:
      - ../../../../experiments/regression/standard/experiment_cv_baseline/results/metrics/metrics_linear_regression.csv:
          cache: false

  train_cv_baseline_decision_tree:
    cmd: python ../../../../scripts/run_with_pythonpath.py ../../../.. -m experiments.regression.standard.experiment_cv_baseline.train_decision_tree
