# CV fold count for every model's search. Unlike other standard-pool experiments
# (single validation split), this one genuinely reads `cv` -- it's the "before"
# baseline that keeps k-fold CV.
cv: 5

# Search budget (n_iter) per model. null = no search (LinearRegression/Ridge/Lasso/
# Polynomial pick their hyperparameter internally, or have none).
n_iter:
  linear_regression: null
  ridge:              null
  lasso:              null
  polynomial:         null
  decision_tree:      30
  knn:                20
  random_forest:      20
  mlp:                15
  xgboost:            20
