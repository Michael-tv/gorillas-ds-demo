# experiment_skew: skewed-extrapolation demo -- filter_skewed produces the low-angle
# training slice + out-of-distribution holdout, the 9-model sweep trains on the
# slice, and train_skewed_concept/train_balanced_concept are the before/after
# comparison. Standard-pool only.
# Paths are ../../../../-prefixed (4 levels under repo root); see README "Running one
# pipeline at a time" for the relative-path convention.

vars:
  - ../../../../params.yaml

stages:

  filter_skewed:
    # --out/--holdout-out resolve relative to data_generation/io.py's hardcoded
    # REPO_ROOT, not CWD -- use bare `data/...` paths here, not the
    # ../../../../-prefixed form used elsewhere in this file.
    cmd: python ../../../../scripts/run_with_pythonpath.py ../../../.. -m data_generation.filter_skewed --out data/skewed_training_data.parquet --holdout-out data/skewed_holdout.parquet
    deps:
      - ../../../../data/${training_data}.parquet
      - ../../../../data_generation/filter_skewed.py
      - ../../../../data_generation/contract.py
      - ../../../../params.py
    params:
      - ../../../../params.yaml:
          - training_data
          - skew.max_angle_deg
    outs:
      - ../../../../data/skewed_training_data.parquet
      - ../../../../data/skewed_holdout.parquet

  train_skewed_linear_regression:
    cmd: python ../../../../scripts/run_with_pythonpath.py ../../../.. -m experiments.regression.standard.experiment_skew.train_linear_regression
    deps:
      - ../../../../data/skewed_training_data.parquet
      - ../../../../experiments/regression/standard/experiment_skew/train_linear_regression.py
      - ../../../../experiments/regression/algorithms/linear_regression.py
      - ../../../../experiments/regression/common/loader.py
      - ../../../../feature_engineering.py
      - ../../../../splitting.py
    params:
      - ../../../../params.yaml:
          - test_size
      - ../../../../experiments/regression/standard/experiment_skew/params.yaml:
          - n_iter.linear_regression
    outs:
      - ../../../../experiments/regression/standard/experiment_skew/results/models/model_linear_regression.joblib
    metrics:
      - ../../../../experiments/regression/standard/experiment_skew/results/metrics/metrics_linear_regression.csv:
          cache: false

  train_skewed_decision_tree:
    cmd: python ../../../../scripts/run_with_pythonpath.py ../../../.. -m experiments.regression.standard.experiment_skew.train_decision_tree
    deps:
