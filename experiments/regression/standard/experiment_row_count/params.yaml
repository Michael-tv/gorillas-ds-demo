# Sample-size tiers: nested prefix slices of the seeded 50000-row pool. Changing
# this list marks every train_row_count_standard_* stage stale.
tiers: [1000, 2000, 5000, 10000, 20000, 50000]

# Search budget (n_iter) per model. null = no search (LinearRegression/Ridge/Lasso/
# Polynomial pick their hyperparameter internally, or have none).
n_iter:
  linear_regression: null
  ridge:              null
  lasso:              null
  polynomial:         null
  decision_tree:      30
  knn:                20
  random_forest:      20
  mlp:                15
  xgboost:            20
