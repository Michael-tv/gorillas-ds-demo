# experiment_bias_variance: underfitting/overfitting demo -- same DecisionTreeRegressor,
# max_depth=1 vs max_depth=None. Standard-pool only.
# Paths are ../../../../-prefixed (4 levels under repo root); see README "Running one
# pipeline at a time" for the relative-path convention.

vars:
  - ../../../../params.yaml

stages:

  train_bias_variance_underfitting:
    cmd: python ../../../../scripts/run_with_pythonpath.py ../../../.. -m experiments.regression.standard.experiment_bias_variance.train_underfitting
    deps:
      - ../../../../data/standard_velocity.parquet
      - ../../../../experiments/regression/standard/experiment_bias_variance/train_underfitting.py
      - ../../../../experiments/regression/common/loader.py
      - ../../../../feature_engineering.py
      - ../../../../splitting.py
    params:
      - ../../../../params.yaml:
          - n_samples
          - test_size
    outs:
      - ../../../../experiments/regression/standard/experiment_bias_variance/results/models/model_underfitting.joblib
    metrics:
      - ../../../../experiments/regression/standard/experiment_bias_variance/results/metrics/metrics_underfitting.csv:
          cache: false

  train_bias_variance_overfitting:
    cmd: python ../../../../scripts/run_with_pythonpath.py ../../../.. -m experiments.regression.standard.experiment_bias_variance.train_overfitting
    deps:
      - ../../../../data/standard_velocity.parquet
      - ../../../../experiments/regression/standard/experiment_bias_variance/train_overfitting.py
      - ../../../../experiments/regression/common/loader.py
      - ../../../../feature_engineering.py
      - ../../../../splitting.py
    params:
      - ../../../../params.yaml:
          - n_samples
          - test_size
    outs:
      - ../../../../experiments/regression/standard/experiment_bias_variance/results/models/model_overfitting.joblib
    metrics:
      - ../../../../experiments/regression/standard/experiment_bias_variance/results/metrics/metrics_overfitting.csv:
          cache: false

