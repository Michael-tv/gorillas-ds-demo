# experiment_eng: 9-model engineered-feature sweep on data/gorillas_velocity.parquet.
# Same pattern as ../experiment_raw/dvc.yaml, ENG_FEATURES instead of RAW_FEATURES.
# Paths are ../../../../-prefixed (4 levels under repo root); see README "Running one
# pipeline at a time" for the relative-path convention.

stages:

  train_eng_velocity_linear_regression:
    cmd: python ../../../../scripts/run_with_pythonpath.py ../../../.. -m experiments.regression.velocity.experiment_eng.train_linear_regression
    deps:
      - ../../../../data/gorillas_velocity.parquet
      - ../../../../experiments/regression/velocity/experiment_eng/train_linear_regression.py
      - ../../../../experiments/regression/algorithms/linear_regression.py
      - ../../../../experiments/regression/common/loader.py
      - ../../../../feature_engineering.py
      - ../../../../splitting.py
    params:
      - ../../../../params.yaml:
          - test_size
      - ../../../../experiments/regression/velocity/experiment_eng/params.yaml:
          - cv
          - n_iter.linear_regression
    outs:
      - ../../../../experiments/regression/velocity/experiment_eng/results/models/model_linear_regression.joblib
    metrics:
      - ../../../../experiments/regression/velocity/experiment_eng/results/metrics/metrics_linear_regression.csv:
          cache: false

  train_eng_velocity_decision_tree:
