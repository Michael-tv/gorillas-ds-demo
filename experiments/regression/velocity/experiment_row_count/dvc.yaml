# experiment_row_count (regression): does more data help? Each script sweeps 6
# sample-size tiers internally on data/gorillas_velocity.parquet.
# Paths are ../../../../-prefixed (4 levels under repo root); see README "Running one
# pipeline at a time" for the relative-path convention.

stages:

  train_row_count_velocity_linear_regression:
    cmd: python ../../../../scripts/run_with_pythonpath.py ../../../.. -m experiments.regression.velocity.experiment_row_count.train_linear_regression
    deps:
      - ../../../../data/gorillas_velocity.parquet
      - ../../../../experiments/regression/velocity/experiment_row_count/train_linear_regression.py
      - ../../../../experiments/regression/algorithms/linear_regression.py
      - ../../../../experiments/regression/common/loader.py
      - ../../../../feature_engineering.py
      - ../../../../splitting.py
    params:
      - ../../../../params.yaml:
          - test_size
      - ../../../../experiments/regression/velocity/experiment_row_count/params.yaml:
          - tiers
          - n_iter.linear_regression
    outs:
      - ../../../../experiments/regression/velocity/experiment_row_count/results/models/linear_regression/
    metrics:
      - ../../../../experiments/regression/velocity/experiment_row_count/results/metrics/metrics_linear_regression.csv:
          cache: false

  train_row_count_velocity_decision_tree:
