# CV fold count per model. Grouped, label-stratified CV to avoid leaking a board's
# correlated throws across folds. Capped at available groups -- see splitting.cv_for().
cv: 5

# RandomizedSearchCV budget per model. `null` = no search (logistic regression has
# no hyperparameters to tune here).
n_iter:
  logistic_regression: null
  decision_tree:        30
  knn:                  12
  random_forest:        20
  mlp:                  15
  xgboost:              20
