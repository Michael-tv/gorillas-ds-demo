# Sample-size tiers -- nested prefixes of one seeded pool (data/gorillas_effort.parquet,
# 5000 rows). Tracked as a params dep, so changing this marks every
# train_row_count_classification_effort_* stage stale.
tiers: [500, 1000, 2000, 3000, 4000, 5000]

# No `cv` here -- inner hyperparameter search uses a plain ShuffleSplit
# (splitting.single_split_cv()), not experiment_classification's group-aware,
# label-stratified k-fold. Outer train/test split is still group-aware.
# Deliberate: leakage risk judged acceptable for this sweep.

# RandomizedSearchCV budget per model. `null` = no search (logistic regression has
# no hyperparameters to tune here).
n_iter:
  logistic_regression: null
  decision_tree:        30
  knn:                  12
  random_forest:        20
  mlp:                  15
  xgboost:              20
