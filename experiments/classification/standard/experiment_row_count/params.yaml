# Sample-size tiers -- nested prefixes of one seeded pool (data/standard_velocity.parquet,
# 50000 rows). Tracked as a params dep, so changing this marks every
# train_row_count_classification_standard_* stage stale.
tiers: [1000, 2000, 5000, 10000, 20000, 50000]

# RandomizedSearchCV budget per model. `null` = no search (logistic regression has
# no hyperparameters to tune here).
n_iter:
  logistic_regression: null
  decision_tree:        30
  knn:                  12
  random_forest:        20
  mlp:                  15
  xgboost:              20
