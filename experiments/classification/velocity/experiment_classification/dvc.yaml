# experiment_classification: the 6-model classification sweep, permanently on data/gorillas_velocity.parquet.
# Paths are ../../../../-prefixed (4 levels under repo root); see README "Running one
# pipeline at a time" for the relative-path convention.

stages:

  train_classification_velocity_logistic_regression:
    cmd: python ../../../../scripts/run_with_pythonpath.py ../../../.. -m experiments.classification.velocity.experiment_classification.train_logistic_regression
    deps:
      - ../../../../data/gorillas_velocity.parquet
      - ../../../../experiments/classification/velocity/experiment_classification/train_logistic_regression.py
      - ../../../../experiments/classification/algorithms/logistic_regression.py
      - ../../../../experiments/classification/common/loader.py
      - ../../../../feature_engineering.py
      - ../../../../splitting.py
    params:
      - ../../../../params.yaml:
          - test_size
      - ../../../../experiments/classification/velocity/experiment_classification/params.yaml:
          - cv
          - n_iter.logistic_regression
    outs:
      - ../../../../experiments/classification/velocity/experiment_classification/results/models/model_logistic_regression.joblib
    metrics:
      - ../../../../experiments/classification/velocity/experiment_classification/results/metrics/metrics_logistic_regression.csv:
          cache: false

  train_classification_velocity_decision_tree:
    cmd: python ../../../../scripts/run_with_pythonpath.py ../../../.. -m experiments.classification.velocity.experiment_classification.train_decision_tree
    deps:
      - ../../../../data/gorillas_velocity.parquet
      - ../../../../experiments/classification/velocity/experiment_classification/train_decision_tree.py
      - ../../../../experiments/classification/algorithms/decision_tree.py
      - ../../../../experiments/classification/common/loader.py
      - ../../../../feature_engineering.py
      - ../../../../splitting.py
    params:
      - ../../../../params.yaml:
          - test_size
      - ../../../../experiments/classification/velocity/experiment_classification/params.yaml:
          - cv
          - n_iter.decision_tree
    outs:
      - ../../../../experiments/classification/velocity/experiment_classification/results/models/model_decision_tree.joblib
    metrics:
      - ../../../../experiments/classification/velocity/experiment_classification/results/metrics/metrics_decision_tree.csv:
          cache: false

  train_classification_velocity_knn:
    cmd: python ../../../../scripts/run_with_pythonpath.py ../../../.. -m experiments.classification.velocity.experiment_classification.train_knn
    deps:
      - ../../../../data/gorillas_velocity.parquet
      - ../../../../experiments/classification/velocity/experiment_classification/train_knn.py
      - ../../../../experiments/classification/algorithms/knn.py
      - ../../../../experiments/classification/common/loader.py
      - ../../../../feature_engineering.py
      - ../../../../splitting.py
    params:
