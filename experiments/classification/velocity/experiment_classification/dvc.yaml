      - ../../../../experiments/classification/common/loader.py
      - ../../../../feature_engineering.py
      - ../../../../splitting.py
    params:
      - ../../../../params.yaml:
          - test_size
      - ../../../../experiments/classification/velocity/experiment_classification/params.yaml:
          - cv
          - n_iter.mlp
    outs:
      - ../../../../experiments/classification/velocity/experiment_classification/results/models/model_mlp.joblib
