          cache: false

  train_classification_velocity_random_forest:
    cmd: python ../../../../scripts/run_with_pythonpath.py ../../../.. -m experiments.classification.velocity.experiment_classification.train_random_forest
    deps:
      - ../../../../data/gorillas_velocity.parquet
      - ../../../../experiments/classification/velocity/experiment_classification/train_random_forest.py
      - ../../../../experiments/classification/algorithms/random_forest.py
      - ../../../../experiments/classification/common/loader.py
      - ../../../../feature_engineering.py
      - ../../../../splitting.py
    params:
      - ../../../../params.yaml:
          - test_size
      - ../../../../experiments/classification/velocity/experiment_classification/params.yaml:
          - cv
