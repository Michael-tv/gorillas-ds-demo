# experiment_row_count (classification): does more data help? Each script sweeps 6
# sample-size tiers internally on data/gorillas_velocity.parquet.
# Paths are ../../../../-prefixed (4 levels under repo root); see README "Running one
# pipeline at a time" for the relative-path convention.

stages:


  train_row_count_classification_velocity_logistic_regression:
    cmd: python ../../../../scripts/run_with_pythonpath.py ../../../.. -m experiments.classification.velocity.experiment_row_count.train_logistic_regression
    deps:
      - ../../../../data/gorillas_velocity.parquet
      - ../../../../experiments/classification/velocity/experiment_row_count/train_logistic_regression.py
      - ../../../../experiments/classification/algorithms/logistic_regression.py
      - ../../../../experiments/classification/common/loader.py
      - ../../../../feature_engineering.py
      - ../../../../splitting.py
    params:
      - ../../../../params.yaml:
          - test_size
      - ../../../../experiments/classification/velocity/experiment_row_count/params.yaml:
          - tiers
          - n_iter.logistic_regression
    outs:
      - ../../../../experiments/classification/velocity/experiment_row_count/results/models/logistic_regression/
    metrics:
      - ../../../../experiments/classification/velocity/experiment_row_count/results/metrics/metrics_logistic_regression.csv:
          cache: false

  train_row_count_classification_velocity_decision_tree:
    cmd: python ../../../../scripts/run_with_pythonpath.py ../../../.. -m experiments.classification.velocity.experiment_row_count.train_decision_tree
