vars:
  - dvc_datasets.yaml

stages:

  # ── Data generation ──────────────────────────────────────────────────────
  # dvc_datasets.yaml lists each dataset (name -> generate() args); this
  # `foreach` expands one independently-cached stage per entry (generate@<name>),
  # writing data/<name>.parquet. Add a dataset there, not here.
  #
  # Every generated file carries both the regression target (landing_distance_m)
  # and classification target (hit_target). Engineered features are derived in
  # each model's sklearn Pipeline (feature_engineering.EngineeredFeatures), not stored here.
  #
  # standard_effort/standard_velocity are each one seeded 50000-row pool;
  # experiments sample the first `n_samples` rows (params.yaml) rather than
  # generating a file per size, so convergence sweeps are nested draws.
  #
  # A dataset variant expressible as a row filter over an existing file doesn't
  # need a dvc_datasets.yaml entry -- see experiment_skew/dvc.yaml's filter_skewed stage.
  #
  # This file holds only the two shared data producers. Each training pipeline
  # lives at experiments/<domain>/<mode>/<experiment>/dvc.yaml and depends on a
  # file produced here (DVC resolves cross-pipeline deps by file path). Run
  # `dvc repro -P` to reproduce everything, `-R experiments/<domain>/<mode>` for
  # one mode, or target one experiment's dvc.yaml directly.

  generate:
    foreach: ${datasets}
    do:
      cmd: python -m data_generation.generate --n ${item.n} --seed ${item.seed} --input-mode ${item.input_mode} --elevation-mean ${item.elevation_mean} --elevation-std ${item.elevation_std} --hit-tolerance ${item.hit_tolerance} --out data/${key}.parquet
      deps:
        - data_generation/generate.py
        - data_generation/sampling.py
        - data_generation/outliers.py
        - data_generation/io.py
        - physics.py
      outs:
        - data/${key}.parquet

  # ── Data generation: the real QBasic game, as a second producer ──────────
  # dvc_datasets.yaml's `gorillas_datasets` lists the game-sourced variants,
  # same shape as `datasets` above. Different module (data_generation.gorillas,
  # driving qbasic_gorillas/dosbox-datagen instead of physics.py), so it's a
  # separate stage rather than folded into `generate`.
  #
  # gorilla.bas is a dep, not QBASIC.EXE (the interpreter binary never changes).
  # --workers is deliberately absent from `cmd:` -- it only affects concurrency,
  # not the resulting rows, so it shouldn't invalidate the cache. Run the
  # module directly to override it for a faster one-off pull.

  generate_gorillas:
    foreach: ${gorillas_datasets}
    do:
      cmd: python -m data_generation.gorillas --n ${item.n} --seed ${item.seed} --input-mode ${item.input_mode} --throws ${item.throws} --boards-per-chunk ${item.boards_per_chunk} --hit-tolerance ${item.hit_tolerance} --overwrite --out data/${key}.parquet --raw-out data/${key}_throws.parquet
      deps:
        - data_generation/gorillas.py
        - data_generation/outliers.py
        - data_generation/io.py
        - qbasic_gorillas/dosbox-datagen/gorilla.bas
      outs:
        - data/${key}.parquet
        - data/${key}_throws.parquet
