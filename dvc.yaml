vars:
  - dvc_datasets.yaml

stages:

  # ── Data generation ──────────────────────────────────────────────────────
  # data_generation/generate.py's generate() is the one generation engine;
  # dvc_datasets.yaml lists every dataset to produce with it (one dict entry
  # per dataset, keyed by name, holding its generate() arguments). This
  # `foreach` expands one independent stage instance per entry (generate@
  # <name>) writing data/<name>.parquet -- each instance's `cmd:` embeds only
  # that entry's own values, so DVC hashes and caches it independently:
  # editing one dataset's parameters in dvc_datasets.yaml reruns only that
  # dataset's generate@<name> stage, never the others. Add a dataset by
  # adding an entry there, not by editing this stage.
  #
  # Every generated file carries both the regression target
  # (landing_distance_m) and the classification target
  # (target_distance_m/hit_target) -- both domains train from the exact same
  # file, for every dataset below (standard and Gorillas alike -- see
  # dvc_datasets.yaml's comments). Engineered features (wind_x_ms,
  # drag_param, height_diff_m) are derived inside each model's own sklearn
  # Pipeline (see feature_engineering.EngineeredFeatures), never stored here.
  #
  # data/standard_effort.parquet and data/standard_velocity.parquet are each
  # a single seeded, pre-shuffled pool at the largest size (50000 rows) --
  # pipelines/standard samples the first `n_samples` rows from whichever one
  # a stage reads (see params.yaml) instead of each size having its own
  # generated file. That makes a sample-size convergence experiment
  # (`dvc exp run --set-param n_samples=...`) nested samples of one draw, so
  # growing the sample size is the only thing that changes.
  #
  # A dataset variant expressible as a row filter over an existing generated
  # file (rather than a new draw) doesn't need a dvc_datasets.yaml entry at
  # all -- see pipelines/standard/experiment_skew/dvc.yaml's filter_skewed
  # stage, which trains on a low-angle subset of the pool.
  #
  # This file holds only the two shared data producers -- standard and
  # Gorillas pools are deliberately kept as two separate datasets, not
  # joined into one (an earlier version of this file joined them per mode
  # via a now-removed join_effort/join_velocity stage; reversed at the repo
  # owner's request -- "they are meant for two different experiments").
  # Every training stage lives in its own pipeline under pipelines/ -- one
  # per {mode, experiment}: pipelines/standard/<experiment> reads whichever
  # pool ${training_data} names (standard_effort, standard_velocity, or any
  # other generated pool); pipelines/effort/<experiment> and
  # pipelines/velocity/<experiment> are permanently on gorillas_effort/
  # gorillas_velocity. Each is a standalone dvc.yaml with a `deps:` entry
  # naming a file THIS file's stages produce -- DVC resolves that
  # cross-pipeline dependency by the file path itself, not by an explicit
  # pipeline reference, the same way any two stages depend on each other;
  # no different from a dependency within one file. Run `dvc repro -P` from
  # the repo root to reproduce every pipeline in dependency order, `dvc
  # repro -R pipelines/<mode>` for one mode's experiments, or target
  # `pipelines/<mode>/<experiment>/dvc.yaml` to run just that one -- see the
  # README's "Running one pipeline at a time" section.

  generate:
    foreach: ${datasets}
    do:
      cmd: python -m data_generation.generate --n ${item.n} --seed ${item.seed} --input-mode ${item.input_mode} --elevation-mean ${item.elevation_mean} --elevation-std ${item.elevation_std} --hit-tolerance ${item.hit_tolerance} --out data/${key}.parquet
      deps:
        - data_generation/generate.py
        - data_generation/sampling.py
        - data_generation/outliers.py
        - data_generation/io.py
        - physics.py
      outs:
        - data/${key}.parquet

  # ── Data generation: the real QBasic game, as a second producer ──────────
  # dvc_datasets.yaml's `gorillas_datasets` lists the game-sourced variants,
  # same shape as `datasets` above (one dict entry per dataset, one
  # independently-cached generate_gorillas@<key> stage per entry). Different
  # module (data_generation.gorillas, driving qbasic_gorillas/dosbox-datagen/
  # instead of physics.py), so it is its own stage rather than folded into
  # `generate` -- see dvc_datasets.yaml's comment on why.
  #
  # gorilla.bas is a dep, not QBASIC.EXE -- the interpreter binary never
  # changes and DVC would otherwise cache ~200 KB of it per dataset.
  # --workers is deliberately absent from `cmd:`: it only changes how many
  # DOSBox instances run concurrently, never the resulting rows (see
  # data_generation/gorillas.py), so it isn't part of what should invalidate
  # this stage's cache. Run the module directly (not through `dvc repro`) to
  # override it for a faster one-off pull.

  generate_gorillas:
    foreach: ${gorillas_datasets}
    do:
      cmd: python -m data_generation.gorillas --n ${item.n} --seed ${item.seed} --input-mode ${item.input_mode} --throws ${item.throws} --boards-per-chunk ${item.boards_per_chunk} --hit-tolerance ${item.hit_tolerance} --overwrite --out data/${key}.parquet --raw-out data/${key}_throws.parquet
      deps:
        - data_generation/gorillas.py
        - data_generation/outliers.py
        - data_generation/io.py
        - qbasic_gorillas/dosbox-datagen/gorilla.bas
      outs:
        - data/${key}.parquet
        - data/${key}_throws.parquet
