# Standalone pipeline: every regression model, trained on the Gorillas
# velocity-mode pool. See pipelines/effort_regression/dvc.yaml's header for
# the full explanation of this pattern (cross-pipeline deps, why every path
# is ../../-prefixed, why `params:` names ../../params.yaml explicitly).

vars:
  - ../../dvc_models_regression.yaml
  - ../../params.yaml

stages:

  train_raw_velocity:
    foreach: ${regression_models}
    do:
      cmd: python ../../scripts/run_with_pythonpath.py ../../models/regression/run_raw_velocity ../../models/regression/${item.script} TRAIN_MODEL_NAME=${key} TRAIN_CLEAN=${item.clean}
      deps:
        - ../../data/gorillas_velocity_regression.parquet
        - ../../models/regression/${item.script}
        - ../../models/regression/run_raw_velocity/train_utils.py
        - ../../models/regression/common/loader.py
        - ../../splitting.py
      params:
        - ../../params.yaml:
            - test_size
            - search.regression.${item.model}.n_iter
            - search.regression.${item.model}.cv
      outs:
        - ../../experiments/regression/run_raw_velocity/models/model_${key}.joblib
      metrics:
        - ../../experiments/regression/run_raw_velocity/models/metrics_${key}.csv:
            cache: false

  train_eng_velocity:
    foreach: ${regression_models}
    do:
      cmd: python ../../scripts/run_with_pythonpath.py ../../models/regression/run_eng_velocity ../../models/regression/${item.script} TRAIN_MODEL_NAME=${key} TRAIN_CLEAN=${item.clean}
      deps:
        - ../../data/gorillas_velocity_regression.parquet
        - ../../models/regression/${item.script}
        - ../../models/regression/run_eng_velocity/train_utils.py
        - ../../models/regression/common/loader.py
        - ../../feature_engineering.py
        - ../../splitting.py
      params:
        - ../../params.yaml:
            - test_size
            - search.regression.${item.model}.n_iter
            - search.regression.${item.model}.cv
      outs:
        - ../../experiments/regression/run_eng_velocity/models/model_${key}.joblib
      metrics:
        - ../../experiments/regression/run_eng_velocity/models/metrics_${key}.csv:
            cache: false
