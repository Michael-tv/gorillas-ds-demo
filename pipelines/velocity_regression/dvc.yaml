# Standalone pipeline: every regression model, trained on the Gorillas
# velocity-mode pool. See pipelines/effort_regression/dvc.yaml's header for
# the full explanation of this pattern.

vars:
  - ../../dvc_models_regression.yaml
  - ../../params.yaml

stages:

  train_raw_velocity:
    foreach: ${regression_models}
    do:
      cmd: python ../../scripts/run_with_pythonpath.py ../.. -m models.regression.train --run raw_velocity --algorithm ${item.algorithm} --key ${key} --clean "${item.clean}"
      deps:
        - ../../data/gorillas_velocity_regression.parquet
        - ../../models/regression/train.py
        - ../../models/regression/algorithms/${item.algorithm}.py
        - ../../models/regression/runs.py
        - ../../models/regression/common/loader.py
        - ../../feature_engineering.py
        - ../../splitting.py
      params:
        - ../../params.yaml:
            - test_size
            - search.regression.${item.algorithm}.n_iter
            - search.regression.${item.algorithm}.cv
      outs:
        - ../../experiments/regression/run_raw_velocity/models/model_${key}.joblib
      metrics:
        - ../../experiments/regression/run_raw_velocity/models/metrics_${key}.csv:
            cache: false

  train_raw_velocity_decision_tree_overfit:
    cmd: python ../../scripts/run_with_pythonpath.py ../.. -m models.regression.train_decision_tree_overfit --run raw_velocity --key decision_tree_overfit --clean ""
    deps:
      - ../../data/gorillas_velocity_regression.parquet
      - ../../models/regression/train_decision_tree_overfit.py
      - ../../models/regression/runs.py
      - ../../models/regression/common/loader.py
      - ../../feature_engineering.py
    outs:
      - ../../experiments/regression/run_raw_velocity/models/model_decision_tree_overfit.joblib
    metrics:
      - ../../experiments/regression/run_raw_velocity/models/metrics_decision_tree_overfit.csv:
          cache: false

  train_eng_velocity:
    foreach: ${regression_models}
    do:
      cmd: python ../../scripts/run_with_pythonpath.py ../.. -m models.regression.train --run eng_velocity --algorithm ${item.algorithm} --key ${key} --clean "${item.clean}"
      deps:
        - ../../data/gorillas_velocity_regression.parquet
        - ../../models/regression/train.py
        - ../../models/regression/algorithms/${item.algorithm}.py
        - ../../models/regression/runs.py
        - ../../models/regression/common/loader.py
        - ../../feature_engineering.py
        - ../../splitting.py
      params:
        - ../../params.yaml:
            - test_size
            - search.regression.${item.algorithm}.n_iter
            - search.regression.${item.algorithm}.cv
      outs:
        - ../../experiments/regression/run_eng_velocity/models/model_${key}.joblib
      metrics:
        - ../../experiments/regression/run_eng_velocity/models/metrics_${key}.csv:
            cache: false

  train_eng_velocity_decision_tree_overfit:
    cmd: python ../../scripts/run_with_pythonpath.py ../.. -m models.regression.train_decision_tree_overfit --run eng_velocity --key decision_tree_overfit --clean ""
    deps:
      - ../../data/gorillas_velocity_regression.parquet
      - ../../models/regression/train_decision_tree_overfit.py
      - ../../models/regression/runs.py
      - ../../models/regression/common/loader.py
      - ../../feature_engineering.py
    outs:
      - ../../experiments/regression/run_eng_velocity/models/model_decision_tree_overfit.joblib
    metrics:
      - ../../experiments/regression/run_eng_velocity/models/metrics_decision_tree_overfit.csv:
          cache: false
