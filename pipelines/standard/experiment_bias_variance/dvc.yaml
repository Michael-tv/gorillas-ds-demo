# experiment_bias_variance: the underfitting/overfitting demo -- same
# DecisionTreeRegressor, max_depth=1 vs max_depth=None. Standard-pool only.
#
# All paths below are ../../../-prefixed -- this file lives three levels
# under the repo root (pipelines/<mode>/<experiment>/dvc.yaml). See the
# top-level README's "Running one pipeline at a time" section for the full
# explanation of this repo's cross-pipeline-dependency / relative-path /
# explicit-params.yaml conventions -- unchanged from the previous
# one-file-per-mode layout, just one directory deeper.

vars:
  - ../../../params.yaml

stages:

  train_bias_variance_underfitting:
    cmd: python ../../../scripts/run_with_pythonpath.py ../../.. -m models.regression.standard.experiment_bias_variance.train_underfitting
    deps:
      - ../../../data/standard_velocity.parquet
      - ../../../models/regression/standard/experiment_bias_variance/train_underfitting.py
      - ../../../models/regression/common/loader.py
      - ../../../feature_engineering.py
      - ../../../splitting.py
    params:
      - ../../../params.yaml:
          - n_samples
          - test_size
    outs:
      - ../../../experiments_results/regression/standard/experiment_bias_variance/models/model_underfitting.joblib
    metrics:
      - ../../../experiments_results/regression/standard/experiment_bias_variance/models/metrics_underfitting.csv:
          cache: false

  train_bias_variance_overfitting:
    cmd: python ../../../scripts/run_with_pythonpath.py ../../.. -m models.regression.standard.experiment_bias_variance.train_overfitting
    deps:
      - ../../../data/standard_velocity.parquet
      - ../../../models/regression/standard/experiment_bias_variance/train_overfitting.py
      - ../../../models/regression/common/loader.py
      - ../../../feature_engineering.py
      - ../../../splitting.py
    params:
      - ../../../params.yaml:
          - n_samples
          - test_size
    outs:
      - ../../../experiments_results/regression/standard/experiment_bias_variance/models/model_overfitting.joblib
    metrics:
      - ../../../experiments_results/regression/standard/experiment_bias_variance/models/metrics_overfitting.csv:
          cache: false

