# experiment_row_count: does more data help? Each script (regression and
# classification) sweeps 6 sample-size tiers internally on
# data/standard_velocity.parquet and writes one metrics row per tier.
#
# All paths below are ../../../-prefixed -- this file lives three levels
# under the repo root (pipelines/<mode>/<experiment>/dvc.yaml). See the
# top-level README's "Running one pipeline at a time" section for the full
# explanation of this repo's cross-pipeline-dependency / relative-path /
# explicit-params.yaml conventions -- unchanged from the previous
# one-file-per-mode layout, just one directory deeper.

stages:

  train_row_count_standard_linear_regression:
    cmd: python ../../../scripts/run_with_pythonpath.py ../../.. -m models.regression.standard.experiment_row_count.train_linear_regression
    deps:
      - ../../../data/standard_velocity.parquet
      - ../../../models/regression/standard/experiment_row_count/train_linear_regression.py
      - ../../../models/regression/algorithms/linear_regression.py
      - ../../../models/regression/common/loader.py
      - ../../../feature_engineering.py
      - ../../../splitting.py
    params:
      - ../../../params.yaml:
          - test_size
          - search.regression.linear_regression.n_iter
          - search.regression.linear_regression.cv
      - ../../../models/regression/standard/experiment_row_count/params.yaml:
          - tiers
    outs:
      - ../../../experiments_results/regression/standard/experiment_row_count/models/model_linear_regression_n1000.joblib
      - ../../../experiments_results/regression/standard/experiment_row_count/models/model_linear_regression_n2000.joblib
