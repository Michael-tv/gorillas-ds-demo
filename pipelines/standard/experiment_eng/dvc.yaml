# experiment_eng: the 9-model engineered-feature sweep, on the switchable
# ${training_data} pool. See ../experiment_raw/dvc.yaml's header -- same
# pattern, ENG_FEATURES instead of RAW_FEATURES.
#
# All paths below are ../../../-prefixed -- this file lives three levels
# under the repo root (pipelines/<mode>/<experiment>/dvc.yaml). See the
# top-level README's "Running one pipeline at a time" section for the full
# explanation of this repo's cross-pipeline-dependency / relative-path /
# explicit-params.yaml conventions -- unchanged from the previous
# one-file-per-mode layout, just one directory deeper.

vars:
  - ../../../params.yaml

stages:

  train_eng_linear_regression:
    cmd: python ../../../scripts/run_with_pythonpath.py ../../.. -m models.regression.standard.experiment_eng.train_linear_regression
    deps:
      - ../../../data/standard_velocity.parquet
      - ../../../models/regression/standard/experiment_eng/train_linear_regression.py
      - ../../../models/regression/algorithms/linear_regression.py
      - ../../../models/regression/common/loader.py
      - ../../../feature_engineering.py
      - ../../../splitting.py
    params:
      - ../../../params.yaml:
          - n_samples
          - test_size
          - search.regression.linear_regression.n_iter
          - search.regression.linear_regression.cv
    outs:
      - ../../../experiments_results/regression/standard/experiment_eng/models/model_linear_regression.joblib
    metrics:
      - ../../../experiments_results/regression/standard/experiment_eng/models/metrics_linear_regression.csv:
          cache: false

  train_eng_decision_tree:
