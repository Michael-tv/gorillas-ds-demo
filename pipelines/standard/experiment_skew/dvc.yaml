# experiment_skew: the skewed-extrapolation demo -- filter_skewed produces
# the low-angle training slice and its out-of-distribution holdout, the
# 9-model sweep trains on the slice, and train_skewed_concept/
# train_balanced_concept are the worked before/after comparison. Standard-
# pool only -- no Gorillas equivalent.
#
# All paths below are ../../../-prefixed -- this file lives three levels
# under the repo root (pipelines/<mode>/<experiment>/dvc.yaml). See the
# top-level README's "Running one pipeline at a time" section for the full
# explanation of this repo's cross-pipeline-dependency / relative-path /
# explicit-params.yaml conventions -- unchanged from the previous
# one-file-per-mode layout, just one directory deeper.

vars:
  - ../../../params.yaml

stages:

  filter_skewed:
    # --out/--holdout-out are NOT resolved relative to CWD -- data_generation/
    # io.py's resolve_output() anchors a relative path to its own hardcoded
    # REPO_ROOT (Path(__file__).resolve().parent.parent), so these must be
    # bare `data/...` paths, unlike every ../../../-prefixed path elsewhere in
    # this file. Confirmed by testing: the ../../../-prefixed form silently wrote
    # to a path two levels ABOVE the repo root instead of failing loudly.
    cmd: python ../../../scripts/run_with_pythonpath.py ../../.. -m data_generation.filter_skewed --out data/skewed_training_data.parquet --holdout-out data/skewed_holdout.parquet
    deps:
      - ../../../data/${training_data}.parquet
      - ../../../data_generation/filter_skewed.py
      - ../../../data_generation/contract.py
      - ../../../params.py
    params:
      - ../../../params.yaml:
          - training_data
          - skew.max_angle_deg
    outs:
      - ../../../data/skewed_training_data.parquet
      - ../../../data/skewed_holdout.parquet

  train_skewed_linear_regression:
    cmd: python ../../../scripts/run_with_pythonpath.py ../../.. -m models.regression.standard.experiment_skew.train_linear_regression
    deps:
      - ../../../data/skewed_training_data.parquet
      - ../../../models/regression/standard/experiment_skew/train_linear_regression.py
      - ../../../models/regression/algorithms/linear_regression.py
      - ../../../models/regression/common/loader.py
      - ../../../feature_engineering.py
      - ../../../splitting.py
    params:
      - ../../../params.yaml:
          - test_size
          - search.regression.linear_regression.n_iter
          - search.regression.linear_regression.cv
    outs:
      - ../../../experiments_results/regression/standard/experiment_skew/models/model_linear_regression.joblib
    metrics:
      - ../../../experiments_results/regression/standard/experiment_skew/models/metrics_linear_regression.csv:
          cache: false

  train_skewed_decision_tree:
