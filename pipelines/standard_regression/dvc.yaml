# Standalone pipeline: every regression model and demo, on the switchable
# training_data pool (params.yaml -- standard_training_data by default, or
# any Gorillas *_regression pool via --set-param). See
# pipelines/effort_regression/dvc.yaml's header for the full explanation of
# the cross-pipeline-dependency / ../../-path / explicit-params.yaml /
# models.regression.train pattern every pipeline under pipelines/ follows.
#
# Everything regression-domain that isn't one of the four fixed Gorillas
# groups lives here: the 9-model sweep (train_raw/train_eng), the skew filter
# and its three consumers, and the leakage/bias-variance demo pairs. They
# share this pipeline rather than each getting their own because they are
# not independently switchable the way training_data is -- filter_skewed,
# train_leakage_* and train_bias_variance_* all read ${training_data}
# directly, so splitting them into more files would only add cross-pipeline
# dependency edges without adding any group a reader would want to run alone.
#
# train_leakage_*, train_bias_variance_* and the two run_skewed concept
# scripts still invoke scripts/run_with_pythonpath.py -- they are each used by
# scripts that live in their OWN folder (train_clean.py next to
# run_leakage/train_utils.py, not shared across multiple folders the way
# train_random_forest.py used to be), so they were never the "same script,
# which of several configs" ambiguity AUDIT.md C1 is about, and rewriting
# them would be scope creep without fixing that problem. Only the
# foreach-matrix stages (train_raw, train_eng, train_skewed) moved to
# models.regression.train.

vars:
  - ../../dvc_models_regression.yaml
  - ../../params.yaml

stages:

  train_raw:
    foreach: ${regression_models}
    do:
      cmd: python ../../scripts/run_with_pythonpath.py ../.. -m models.regression.train --run raw --algorithm ${item.algorithm} --key ${key} --clean "${item.clean}"
      deps:
        - ../../data/${training_data}.parquet
        - ../../models/regression/train.py
        - ../../models/regression/algorithms/${item.algorithm}.py
        - ../../models/regression/runs.py
        - ../../models/regression/common/loader.py
        - ../../feature_engineering.py
        - ../../splitting.py
      params:
        - ../../params.yaml:
            - training_data
            - n_samples
            - test_size
            - search.regression.${item.algorithm}.n_iter
            - search.regression.${item.algorithm}.cv
      outs:
        - ../../experiments/regression/run_raw/models/model_${key}.joblib
      metrics:
        - ../../experiments/regression/run_raw/models/metrics_${key}.csv:
            cache: false

  train_raw_decision_tree_overfit:
    cmd: python ../../scripts/run_with_pythonpath.py ../.. -m models.regression.train_decision_tree_overfit --run raw --key decision_tree_overfit --clean ""
    deps:
      - ../../data/${training_data}.parquet
      - ../../models/regression/train_decision_tree_overfit.py
      - ../../models/regression/runs.py
      - ../../models/regression/common/loader.py
      - ../../feature_engineering.py
    params:
      - ../../params.yaml:
          - training_data
          - n_samples
    outs:
      - ../../experiments/regression/run_raw/models/model_decision_tree_overfit.joblib
    metrics:
      - ../../experiments/regression/run_raw/models/metrics_decision_tree_overfit.csv:
          cache: false

  train_eng:
    foreach: ${regression_models}
    do:
      cmd: python ../../scripts/run_with_pythonpath.py ../.. -m models.regression.train --run eng --algorithm ${item.algorithm} --key ${key} --clean "${item.clean}"
      deps:
        - ../../data/${training_data}.parquet
        - ../../models/regression/train.py
        - ../../models/regression/algorithms/${item.algorithm}.py
        - ../../models/regression/runs.py
        - ../../models/regression/common/loader.py
        - ../../feature_engineering.py
        - ../../splitting.py
      params:
        - ../../params.yaml:
            - training_data
            - n_samples
            - test_size
            - search.regression.${item.algorithm}.n_iter
            - search.regression.${item.algorithm}.cv
      outs:
        - ../../experiments/regression/run_eng/models/model_${key}.joblib
      metrics:
        - ../../experiments/regression/run_eng/models/metrics_${key}.csv:
            cache: false

  train_eng_decision_tree_overfit:
    cmd: python ../../scripts/run_with_pythonpath.py ../.. -m models.regression.train_decision_tree_overfit --run eng --key decision_tree_overfit --clean ""
    deps:
      - ../../data/${training_data}.parquet
      - ../../models/regression/train_decision_tree_overfit.py
      - ../../models/regression/runs.py
      - ../../models/regression/common/loader.py
      - ../../feature_engineering.py
    params:
      - ../../params.yaml:
          - training_data
          - n_samples
    outs:
      - ../../experiments/regression/run_eng/models/model_decision_tree_overfit.joblib
    metrics:
      - ../../experiments/regression/run_eng/models/metrics_decision_tree_overfit.csv:
          cache: false

  # ── The skewed slice: one filter stage, two outputs ──────────────────────
  # Both outputs matter: the kept rows train the skewed models, the excluded
  # rows are the out-of-distribution test set (AUDIT.md tasks 8-10).

  filter_skewed:
    # --out/--holdout-out are NOT resolved relative to CWD -- data_generation/
    # io.py's resolve_output() anchors a relative path to its own hardcoded
    # REPO_ROOT (Path(__file__).resolve().parent.parent), so these must be
    # bare `data/...` paths, unlike every ../../-prefixed path elsewhere in
    # this file. Confirmed by testing: the ../../-prefixed form silently wrote
    # to a path two levels ABOVE the repo root instead of failing loudly.
    cmd: python ../../scripts/run_with_pythonpath.py ../.. -m data_generation.filter_skewed --out data/skewed_training_data.parquet --holdout-out data/skewed_holdout.parquet
    deps:
      - ../../data/${training_data}.parquet
      - ../../data_generation/filter_skewed.py
      - ../../data_generation/contract.py
      - ../../params.py
    params:
      - ../../params.yaml:
          - training_data
          - skew.max_angle_deg
    outs:
      - ../../data/skewed_training_data.parquet
      - ../../data/skewed_holdout.parquet

  train_skewed:
    foreach: ${skewed_models}
    do:
      cmd: python ../../scripts/run_with_pythonpath.py ../.. -m models.regression.train --run skewed --algorithm ${item.algorithm} --key ${key} --clean "${item.clean}"
      deps:
        - ../../data/skewed_training_data.parquet
        - ../../models/regression/train.py
        - ../../models/regression/algorithms/${item.algorithm}.py
        - ../../models/regression/runs.py
        - ../../models/regression/common/loader.py
        - ../../feature_engineering.py
        - ../../splitting.py
      params:
        - ../../params.yaml:
            - training_data
            - skew.max_angle_deg
            - test_size
            - search.regression.${item.algorithm}.n_iter
            - search.regression.${item.algorithm}.cv
      outs:
        - ../../experiments/regression/run_skewed/models/model_${key}.joblib
      metrics:
        - ../../experiments/regression/run_skewed/models/metrics_${key}.csv:
            cache: false

  train_skewed_concept:
    cmd: python ../../scripts/run_with_pythonpath.py ../../models/regression/run_skewed ../../models/regression/run_skewed/train_skewed.py
    deps:
      # Both: it trains on the slice and scores the holdout, which is the point.
      - ../../data/skewed_training_data.parquet
      - ../../data/skewed_holdout.parquet
      - ../../models/regression/run_skewed/train_skewed.py
      - ../../models/regression/run_skewed/train_utils.py
      - ../../models/regression/runs.py
      - ../../models/regression/common/loader.py
      - ../../feature_engineering.py
      - ../../splitting.py
    params:
      - ../../params.yaml:
          - training_data
          - skew.max_angle_deg
          - test_size
    outs:
      - ../../experiments/regression/run_skewed/models/model_skewed.joblib
    metrics:
      - ../../experiments/regression/run_skewed/models/metrics_skewed.csv:
          cache: false

  train_balanced_concept:
    cmd: python ../../scripts/run_with_pythonpath.py ../../models/regression/run_skewed ../../models/regression/run_skewed/train_balanced.py
    deps:
      # The full pool to train on, the slice to size against, the holdout to
      # score on -- all three, so it re-runs when any of them changes.
      - ../../data/${training_data}.parquet
      - ../../data/skewed_training_data.parquet
      - ../../data/skewed_holdout.parquet
      - ../../models/regression/run_skewed/train_balanced.py
      - ../../models/regression/run_skewed/train_utils.py
      - ../../models/regression/runs.py
      - ../../models/regression/common/loader.py
      - ../../feature_engineering.py
      - ../../splitting.py
    params:
      - ../../params.yaml:
          - training_data
          - skew.max_angle_deg
          - test_size
    outs:
      - ../../experiments/regression/run_skewed/models/model_balanced.joblib
    metrics:
      - ../../experiments/regression/run_skewed/models/metrics_balanced.csv:
          cache: false

  # ── Leakage demo (a 10k random sample of the standard pool) ──────────────

  train_leakage_clean:
    cmd: python ../../scripts/run_with_pythonpath.py ../../models/regression/run_leakage ../../models/regression/run_leakage/train_clean.py
    deps:
      - ../../data/${training_data}.parquet
      - ../../models/regression/run_leakage/train_clean.py
      - ../../models/regression/run_leakage/train_utils.py
      - ../../feature_engineering.py
    params:
      - ../../params.yaml:
          - training_data
    outs:
      - ../../experiments/regression/run_leakage/models/model_dt_clean.joblib
    metrics:
      - ../../experiments/regression/run_leakage/models/metrics_dt_clean.csv:
          cache: false

  train_leakage_leaky:
    cmd: python ../../scripts/run_with_pythonpath.py ../../models/regression/run_leakage ../../models/regression/run_leakage/train_leaky.py
    deps:
      - ../../data/${training_data}.parquet
      - ../../models/regression/run_leakage/train_leaky.py
      - ../../models/regression/run_leakage/train_utils.py
      - ../../feature_engineering.py
    params:
      - ../../params.yaml:
          - training_data
    outs:
      - ../../experiments/regression/run_leakage/models/model_dt_leaky.joblib
    metrics:
      - ../../experiments/regression/run_leakage/models/metrics_dt_leaky.csv:
          cache: false

  # ── Bias/variance demo (a 20k random sample of the standard pool) ────────

  train_bias_variance_underfitting:
    cmd: python ../../scripts/run_with_pythonpath.py ../../models/regression/run_bias_variance ../../models/regression/run_bias_variance/train_underfitting.py
    deps:
      - ../../data/${training_data}.parquet
      - ../../models/regression/run_bias_variance/train_underfitting.py
      - ../../models/regression/run_bias_variance/train_utils.py
      - ../../feature_engineering.py
    params:
      - ../../params.yaml:
          - training_data
    outs:
      - ../../experiments/regression/run_bias_variance/models/model_underfitting.joblib
    metrics:
      - ../../experiments/regression/run_bias_variance/models/metrics_underfitting.csv:
          cache: false

  train_bias_variance_overfitting:
    cmd: python ../../scripts/run_with_pythonpath.py ../../models/regression/run_bias_variance ../../models/regression/run_bias_variance/train_overfitting.py
    deps:
      - ../../data/${training_data}.parquet
      - ../../models/regression/run_bias_variance/train_overfitting.py
      - ../../models/regression/run_bias_variance/train_utils.py
      - ../../feature_engineering.py
    params:
      - ../../params.yaml:
          - training_data
    outs:
      - ../../experiments/regression/run_bias_variance/models/model_overfitting.joblib
    metrics:
      - ../../experiments/regression/run_bias_variance/models/metrics_overfitting.csv:
          cache: false
