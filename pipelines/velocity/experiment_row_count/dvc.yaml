      - ../../../data/gorillas_velocity.parquet
      - ../../../models/regression/velocity/experiment_row_count/train_linear_regression.py
      - ../../../models/regression/algorithms/linear_regression.py
      - ../../../models/regression/common/loader.py
      - ../../../feature_engineering.py
      - ../../../splitting.py
    params:
      - ../../../params.yaml:
          - test_size
          - search.regression.linear_regression.n_iter
          - search.regression.linear_regression.cv
    outs:
      - ../../../experiments_results/regression/velocity/experiment_row_count/models/model_linear_regression_n500.joblib
