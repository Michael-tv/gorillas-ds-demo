# experiment_row_count: does more data help? Each script sweeps 6
# sample-size tiers internally on data/gorillas_velocity.parquet.
#
# All paths below are ../../../-prefixed -- this file lives three levels
# under the repo root (pipelines/<mode>/<experiment>/dvc.yaml). See the
# top-level README's "Running one pipeline at a time" section for the full
# explanation of this repo's cross-pipeline-dependency / relative-path /
# explicit-params.yaml conventions -- unchanged from the previous
# one-file-per-mode layout, just one directory deeper.

stages:

  train_row_count_velocity_linear_regression:
    cmd: python ../../../scripts/run_with_pythonpath.py ../../.. -m models.regression.velocity.experiment_row_count.train_linear_regression
